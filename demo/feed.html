<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home / X (Sift demo feed)</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #000; color: #e7e9ea; font: 400 15px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .note { max-width: 600px; margin: 0 auto; padding: 10px 16px; background: #1d1a33; color: #cfc6f2; font-size: 13px; border-bottom: 1px solid #2f3336; }
  header { max-width: 600px; margin: 0 auto; padding: 14px 16px; font-size: 19px; font-weight: 800; border-bottom: 1px solid #2f3336; position: sticky; top: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); }
  article.tweet { max-width: 600px; margin: 0 auto; display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #2f3336; cursor: pointer; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 15px; }
  .body { flex: 1; min-width: 0; }
  .uname { color: #8b98a5; font-size: 14px; }
  .uname b { color: #e7e9ea; font-size: 15px; }
  .ttext { margin-top: 2px; white-space: pre-wrap; }
  .timg { margin-top: 10px; border-radius: 16px; height: 160px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.75); font-size: 13px; }
  .group { display: flex; justify-content: space-between; margin-top: 10px; max-width: 420px; color: #536471; align-items: center; }
  .act { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .ad-label { color: #8b98a5; font-size: 13px; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="note">Sift demo feed - a static, realistic replica of the X timeline DOM (same data-testid hooks). Open this page through the dev manifest to try Sift without logging into X.</div>

  like: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>'
};
const POSTS = [
  { name:"priya builds", handle:"@priyacodes", color:"#7856ff", text:"shipped the new onboarding flow today. activation up 4pts. the trick was deleting three screens, not adding one.", r:"12", rt:"48", l:"312" },
  { name:"MOON VAULT", handle:"@moonvaultfi", color:"#f7b928", text:"🚀 $MVLT PRESALE IS LIVE 🚀\n\nGuaranteed 40x at launch. Drop your SOL wallet, retweet, and tag 3 friends to qualify for the airdrop. Don't miss out!!", r:"891", rt:"4.2K", l:"9.1K", img:"gradient chart going up" },
  { name:"sam altman parody", handle:"@sama_poster", color:"#17bf63", text:"the future is going to be so unbelievably great guys. you have no idea. it's going to be incredible", r:"231", rt:"1.2K", l:"8.4K" },
  { name:"Culture War Daily", handle:"@outrage_hq", color:"#e0245e", text:"This is what they TOOK from you. This is what they're LAUGHING about. These people HATE you and want your kids to suffer. RT if you've had ENOUGH", r:"12K", rt:"31K", l:"89K" },

const tl = document.getElementById('timeline');
let n = 1000;
for (const p of POSTS) {
  const id = n++;
  const a = document.createElement('article');
  a.className = 'tweet';
  a.setAttribute('data-testid', 'tweet');
  a.innerHTML = `
    <div class="avatar" style="background:${p.color}">${p.name[0].toUpperCase()}</div>
    <div class="body">
      ${p.ad ? '<div class="ad-label"><span>Ad</span></div>' : ''}
      <div data-testid="User-Name">
        <a href="/${p.handle.slice(1)}" style="text-decoration:none;color:inherit"><b>${p.name}</b></a>
        <a href="/${p.handle.slice(1)}" style="text-decoration:none"><span class="uname">${p.handle}</span></a>
        <span class="uname"> · 2h</span>
      </div>
      <div data-testid="tweetText" lang="en">${p.text}</div>
      ${p.img ? `<div class="timg" style="background:linear-gradient(135deg, ${p.color}55, ${p.color}22); border:1px solid #2f3336">[image: ${p.img}]</div>` : ''}
      <div role="group" aria-label="post actions" style="display:flex;justify-content:space-between;margin-top:10px;max-width:420px;color:#536471;align-items:center">
        <span class="act">${SVG.reply} ${p.r}</span><span class="act">${SVG.repost} ${p.rt}</span><span class="act">${SVG.like} ${p.l}</span>
        <a href="/${p.handle.slice(1)}/status/${id}" style="color:inherit;text-decoration:none"><time datetime="2026-09-22T06:00:00Z">2h</time></a>
      </div>
    </div>`;
  tl.appendChild(a);
}
</script>
</body>
</html>
